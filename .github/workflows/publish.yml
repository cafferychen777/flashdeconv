name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
      - name: Run tests
        run: pytest tests/ -q
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        run: |
          pkg_version=$(python -c "import flashdeconv; print(flashdeconv.__version__)")
          tag_version="${GITHUB_REF_NAME#v}"
          echo "package ${pkg_version}, tag ${tag_version}"
          test "${pkg_version}" = "${tag_version}"

  build:
    name: Build distribution
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check package
        run: |
          python -m pip install build twine
          python -m build
          twine check dist/*
      - name: Store distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flashdeconv
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
